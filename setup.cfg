[metadata]
name = ckanext-spark
version = 0.1.0
description = Data@Spark theme extension for CKAN
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/BU-Spark/ckanext-spark
author = Gabe Maayan
author_email = gmaayan@bu.edu
license = AGPL
classifiers =
            Development Status :: 4 - Beta
            License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)
            Programming Language :: Python :: 3.9
            Programming Language :: Python :: 3.10
            Programming Language :: Python :: 3.11
keywords = CKAN bu spark theme css

[options]
packages = find:
namespace_packages = ckanext
install_requires =
python_requires = >=3.9
include_package_data = True

[options.package_data]
ckanext.spark =
    public/images/*.png
    public/images/*.svg
    public/images/*.jpg
    public/images/*.jpeg
    public/images/*.gif
    public/images/*.webp

[options.entry_points]
ckan.plugins =
             spark = ckanext.spark.plugin:SparkPlugin

babel.extractors =
                 ckan = ckan.lib.extract:extract_ckan

[options.extras_require]

[extract_messages]
keywords = translate isPlural
add_comments = TRANSLATORS:
output_file = ckanext/spark/i18n/ckanext-spark.pot
width = 80

[init_catalog]
domain = ckanext-spark
input_file = ckanext/spark/i18n/ckanext-spark.pot
output_dir = ckanext/spark/i18n

[update_catalog]
domain = ckanext-spark
input_file = ckanext/spark/i18n/ckanext-spark.pot
output_dir = ckanext/spark/i18n
previous = true

[compile_catalog]
domain = ckanext-spark
directory = ckanext/spark/i18n
statistics = true

[tool:pytest]
filterwarnings =
        ignore::sqlalchemy.exc.SADeprecationWarning
        ignore::sqlalchemy.exc.SAWarning
        ignore::DeprecationWarning
addopts = --ckan-ini test.ini
